<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسعار عيسى العطار</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14663d">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f6ef;--card:#fff;--fg:#1d2a20;--mut:#5e6e62;--ac:#14663d;--acf:#fff;--key:#e4ece0;--hot:#b3361f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a12;--card:#16261b;--fg:#f0ebdc;--mut:#a9b8aa;--ac:#d9a441;--acf:#1b1405;--key:#223829;--hot:#ff8a73}}
:root[data-theme="dark"]{--bg:#0d1a12;--card:#16261b;--fg:#f0ebdc;--mut:#a9b8aa;--ac:#d9a441;--acf:#1b1405;--key:#223829;--hot:#ff8a73}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 100px}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.hd img{width:60px;height:60px;border-radius:16px}
h1{font-size:23px;margin:0}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:12px 0}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;color:var(--mut);margin:14px 0 2px}
.offer{border-right:4px solid var(--hot);background:var(--key);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.offer b{display:block;color:var(--hot)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--key)}
.grp .row:first-of-type{border-top:0}
.row.off{opacity:.55}
.p{font-size:20px;font-weight:700;color:var(--ac);white-space:nowrap}
.tag{display:inline-block;background:var(--hot);color:#fff;font-size:11px;padding:1px 8px;border-radius:8px;margin-right:6px}
input{width:100%;padding:12px;font-size:17px;border-radius:12px;border:1px solid var(--key);background:var(--bg);color:var(--fg);margin-bottom:6px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:700;background:var(--ac);color:var(--acf);cursor:pointer;margin-top:10px}
.btn.s{background:var(--key);color:var(--fg);font-weight:600}
.fb{background:#1877f2;color:#fff}
.x{flex:0 0 auto;border:0;border-radius:10px;background:var(--key);color:var(--fg);cursor:pointer;min-width:36px;height:36px;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{flex:1 1 auto;padding:9px 10px;border-radius:10px;border:0;background:var(--key);color:var(--fg);font-size:15px;cursor:pointer;white-space:nowrap}
.chips button.on{background:var(--ac);color:var(--acf);font-weight:700}
.pk{background:var(--key);border-radius:12px;padding:8px 10px;margin:0 0 6px}
.cb{display:flex;gap:8px;margin-top:6px}
.cb a{flex:1;text-align:center;text-decoration:none;padding:11px 6px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
.call{background:var(--ac);color:var(--acf)}.wa{background:#25d366;color:#fff}.mp{background:var(--key);color:var(--fg)}
#st{text-align:center;padding:8px;border-radius:10px;font-size:13px;margin-top:8px;background:var(--key);color:var(--mut)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:456px;margin:0 auto;z-index:5}
.panel{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);max-width:456px;margin:0 auto;max-height:68vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:6}
#ts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:var(--ac);color:var(--acf);padding:10px 16px;border-radius:12px;font-weight:700;z-index:9;white-space:nowrap}
.th{width:72px;height:72px;object-fit:cover;border-radius:10px;flex:0 0 auto;cursor:pointer}#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}#lb.hide{display:none}#cc{flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;background:var(--card);padding:8px 0;margin:8px 0;z-index:3}#cc::-webkit-scrollbar{display:none}#cc button{flex:0 0 auto}#lbi{max-width:92vw;max-height:68vh;min-width:60vw;object-fit:contain;border-radius:14px;background:#fff}#lbc{color:#fff;font-size:18px;font-weight:700;text-align:center}.hide{display:none}
</style>
</head>
<body>
<main>
<div class="hd"><img src="icon-192.png" alt=""><div><h1 id="nm">عيسى العطار</h1><div class="mut" id="up">جارٍ التحميل...</div></div></div>
<div id="st" class="hide"></div>
<button class="btn hide" id="ib">⬇️ ثبّت التطبيق على جوالك</button>
<a class="btn s hide" id="apk" href="attar.apk" download>📥 تحميل نسخة أندرويد (APK)</a>
<div class="card hide" id="hint" style="line-height:1.9;font-size:15px"></div>
<div id="of"></div>
<div class="card"><h2>قائمة الأسعار (للكيلو)</h2><input id="q" placeholder="🔍 ابحث عن صنف"><div class="chips hide" id="cc"></div><div id="ls"></div></div>
<div class="card hide" id="ct"></div>
<a class="btn fb hide" id="fb" target="_blank" rel="noopener">👍 تابعنا على فيسبوك</a>
<button class="btn s" id="rf">🔄 تحديث الأسعار</button>
</main>
<div id="lb" class="hide"><img id="lbi" alt=""><div id="lbc"></div><div style="color:#ccc;font-size:13px">اضغط في أي مكان للإغلاق</div></div>
<div id="ts" class="hide"></div>
<div id="cb" class="bar hide"><button class="btn" id="cbt" style="margin:0"></button></div>
<div id="cp" class="card panel hide">
<h2>🛒 طلبك</h2><div id="cl"></div>
<input id="cn" placeholder="اسمك (اختياري)" style="margin-top:8px"><input id="cnote" placeholder="ملاحظات (اختياري)">
<div class="mut">السعر تقريبي، ويؤكد لك المحل السعر النهائي.</div>
<button class="btn" id="sw">📲 إرسال الطلب عبر واتساب</button>
<button class="btn s" id="co">📋 نسخ الطلب</button>
<button class="btn s" id="cx">🗑 تفريغ السلة</button>
<button class="btn s" id="cc2">إغلاق</button>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fp=n=>(+n).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
const okUrl=u=>/^https:\/\/([a-z0-9-]+\.)*(facebook\.com|fb\.com)\//i.test(u)||/^https:\/\/fb\.me\//i.test(u);
let D=null,off=false,cat='',openI=-1,showCart=false,tt;
let cart=[];try{cart=JSON.parse(localStorage.getItem('cart'))||[]}catch(e){}
const saveCart=()=>{try{localStorage.setItem('cart',JSON.stringify(cart))}catch(e){}};
function toast(s){const t=$('ts');t.textContent=s;t.classList.remove('hide');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('hide'),1800)}
const cur=()=>D&&D.cur?' '+D.cur:'';
const item=n=>((D&&D.items)||[]).find(i=>i.n===n);
const price=n=>{const x=item(n);return x?+x.p:0};
const isPc=n=>{const x=item(n);return !!x&&x.u==='pc'};
const lineCost=l=>isPc(l.n)?(l.q||0)*price(l.n):(l.g||0)*price(l.n)/1000;
const qtyTxt=l=>isPc(l.n)?(l.q||0)+' عبوة':(l.g||0)+' جم';
const total=()=>cart.reduce((a,l)=>a+lineCost(l),0);
function clean(){if(!D||!D.items)return;D.items.forEach(x=>{if(x.u===1||x.u===true||x.u==='1')x.u='pc'});for(let i=cart.length-1;i>=0;i--){const l=cart[i],x=D.items.find(k=>k.n===l.n);if(!x||x.o||(x.u==='pc'?!l.q:!l.g))cart.splice(i,1)}saveCart()}
let IMG={};
(function(){try{const s=JSON.parse(localStorage.getItem('img'));if(s&&s.i)IMG=ok(s.i)}catch(e){}})();
function ok(i){const o={};for(const k in i)if(/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(i[k]))o[k]=i[k];return o}
async function loadImgs(){
  if(!D||!D.imgv)return;
  let s=null;try{s=JSON.parse(localStorage.getItem('img'))}catch(e){}
  if(s&&s.v===D.imgv){IMG=ok(s.i||{});return}
  try{const r=await fetch('images.json?v='+D.imgv);if(!r.ok)throw 0;const j=await r.json();IMG=ok(j.i||{});try{localStorage.setItem('img',JSON.stringify({v:D.imgv,i:IMG}))}catch(e){}}catch(e){}
}
async function load(){
  try{const r=await fetch('prices.json',{cache:'no-store'});if(!r.ok)throw 0;D=await r.json();off=false;try{localStorage.setItem('d',JSON.stringify(D))}catch(e){}}
  catch(e){try{D=JSON.parse(localStorage.getItem('d'))}catch(x){D=null}off=true}
  clean();render();loadImgs().then(()=>{if(D&&D.items)list()});
}
function render(){
  const st=$('st');
  if(!D||!Array.isArray(D.items)){$('up').textContent='';st.classList.remove('hide');st.textContent='تعذّر تحميل الأسعار، تأكد من اتصالك بالإنترنت ثم اضغط تحديث.';$('ls').innerHTML='';drawCart();return}
  $('nm').textContent=D.name||'عيسى العطار';document.title='أسعار '+(D.name||'');
  $('up').textContent=D.updated?'آخر تحديث: '+new Date(D.updated).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'}):'';
  st.classList.toggle('hide',!off);st.textContent=off?'⚠️ أنت غير متصل بالإنترنت، هذه آخر أسعار محفوظة وقد تكون قديمة.':'';
  const of=D.offers||[];
  $('of').innerHTML=of.length?'<div class="card"><h2>🔥 العروض</h2>'+of.map(o=>'<div class="offer"><b>'+esc(o.t||'')+'</b>'+esc(o.d||'')+'</div>').join('')+'</div>':'';
  list();contact();drawCart();
}
const IC=[['بهار','🌶'],['عشاب','🌿'],['حبوب','🫘'],['أرز','🍚'],['ارز','🍚'],['زي','🫒'],['مكرون','🍝'],['عسل','🍯']];
const ic=c=>{const m=IC.find(k=>String(c).includes(k[0]));return m?m[1]:'🛒'};
function list(){
  const cats=[...new Set(D.items.map(x=>x.c).filter(Boolean))];
  if(cat&&!cats.includes(cat))cat='';
  const cc=$('cc');cc.classList.toggle('hide',!cats.length);
  cc.innerHTML=cats.length?['',...cats].map(c=>'<button data-c="'+esc(c)+'" class="'+(c===cat?'on':'')+'">'+(c?ic(c)+' '+esc(c):'الكل')+'</button>').join(''):'';
  cc.querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;openI=-1;list()});
  const q=$('q').value.trim();
  const its=D.items.map((x,i)=>({x,i})).filter(o=>(!q||String(o.x.n).includes(q))&&(!cat||(o.x.c||'')===cat));
  const names=cats.length?[...cats,'أخرى']:[''];
  const showFe=!cat&&!q&&its.some(o=>o.x.f);
  const fe=showFe?'<div class="grp"><h3>⭐ الأكثر طلباً</h3>'+its.filter(o=>o.x.f).map(o=>row(o.x,o.i,false)).join('')+'</div>':'';
  const html=fe+names.map(g=>{
    const rows=its.filter(o=>cats.length?((o.x.c||'أخرى')===g):true);
    if(!rows.length)return '';
    return '<div class="grp">'+(g&&!cat?'<h3>'+ic(g)+' '+esc(g)+'</h3>':'')+rows.map(o=>row(o.x,o.i,showFe&&!!o.x.f)).join('')+'</div>'}).join('');
  $('ls').innerHTML=html||'<div class="mut" style="padding:10px 0">لا توجد نتائج</div>';
  $('ls').querySelectorAll('.th').forEach(im=>im.onclick=()=>openLb(im.dataset.n));
  $('ls').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const i=+b.dataset.o;openI=openI===i?-1:i;list()});
  $('ls').querySelectorAll('[data-ag]').forEach(b=>b.onclick=()=>add(D.items[+b.dataset.n].n,+b.dataset.ag));
  $('ls').querySelectorAll('[data-cg]').forEach(b=>b.onclick=()=>{const v=+$('cg').value;if(v>0)add(D.items[+b.dataset.cg].n,v);else toast('اكتب الكمية بالجرام')});
}
function openLb(n){const s=IMG[n];if(!s)return;const x=item(n);$('lbi').src=s;$('lbc').textContent=n+(x?' — '+fp(x.p)+cur()+' للعبوة':'');$('lb').classList.remove('hide')}
function row(x,i,hp){
  const pc=x.u==='pc';
  return '<div class="row'+(x.o?' off':'')+'">'+(pc&&IMG[x.n]?'<img class="th" data-n="'+esc(x.n)+'" src="'+IMG[x.n]+'" alt="">':'')+'<div style="flex:1"><b>'+esc(x.n)+'</b>'+(x.o?'<span class="tag">نفد</span>':'')+'<div class="mut">'+(pc?'السعر للعبوة الواحدة':'½ كيلو: '+fp(x.p/2)+' • ¼ كيلو: '+fp(x.p/4)+' • 100 جم: '+fp(x.p/10))+'</div></div><div class="p">'+fp(x.p)+cur()+(pc?'<div class="mut" style="text-align:left">للعبوة</div>':'')+'</div>'+(x.o?'':'<button class="x" data-o="'+i+'">➕</button>')+'</div>'
  +(openI===i&&!x.o&&!hp?'<div class="pk"><div class="chips">'+(pc?[1,2,3,6,12]:[100,250,500,1000]).map(g=>'<button data-ag="'+g+'" data-n="'+i+'">'+(pc?g+' عبوة':g>=1000?'كيلو':g+' جم')+'</button>').join('')+'</div><div class="cb"><input id="cg" type="number" inputmode="decimal" placeholder="'+(pc?'عدد آخر من العبوات':'كمية أخرى بالجرام')+'" style="margin:0"><a class="call" data-cg="'+i+'" style="flex:0 0 80px;display:flex;align-items:center;justify-content:center">أضف</a></div></div>':'');
}
function add(n,v){v=Math.round(+v);if(!(v>0))return;const pc=isPc(n),l=cart.find(x=>x.n===n);if(l){if(pc)l.q=(l.q||0)+v;else l.g=(l.g||0)+v}else cart.push(pc?{n,q:v}:{n,g:v});saveCart();toast('✅ أُضيف '+(pc?v+' عبوة':v+' جم')+' من '+n);drawCart()}
function drawCart(){
  const n=cart.length;
  $('cb').classList.toggle('hide',!n);
  $('cbt').textContent='🛒 السلة ('+n+') — تقريباً '+fp(total())+cur();
  if(!showCart||!n){$('cp').classList.add('hide');return}
  $('cp').classList.remove('hide');
  $('cl').innerHTML=cart.map((l,i)=>'<div class="row"><div><b>'+esc(l.n)+'</b><div class="mut">'+qtyTxt(l)+'</div></div><div>'+fp(lineCost(l))+cur()+' <button class="x" data-r="'+i+'">✕</button></div></div>').join('')+'<div class="row"><b>الإجمالي التقريبي</b><div class="p">'+fp(total())+cur()+'</div></div>';
  $('cl').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.r,1);saveCart();drawCart()});
}
function msg(){
  const nm=$('cn').value.trim(),nt=$('cnote').value.trim();
  return 'طلب جديد من تطبيق '+(D.name||'')+(nm?'\nالاسم: '+nm:'')+'\n\n'+cart.map(l=>'• '+l.n+': '+qtyTxt(l)+' (≈ '+fp(lineCost(l))+')').join('\n')+'\n\nالإجمالي التقريبي: '+fp(total())+cur()+(nt?'\nملاحظات: '+nt:'');
}
function waNum(){for(const p of [D.wa,...(D.phones||[])].filter(Boolean)){const n=String(p).replace(/[^\d+]/g,'');if(n.startsWith('+'))return n.slice(1);if(n.startsWith('00'))return n.slice(2)}return ''}
$('cbt').onclick=()=>{showCart=!showCart;drawCart()};
$('cc2').onclick=()=>{showCart=false;drawCart()};
$('cx').onclick=()=>{cart=[];saveCart();showCart=false;drawCart()};
$('sw').onclick=()=>{const n=waNum();if(!n){toast('رقم الواتساب غير مضبوط، انسخ الطلب وأرسله للمحل');return}window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg()),'_blank')};
$('co').onclick=async()=>{try{await navigator.clipboard.writeText(msg());toast('✅ تم نسخ الطلب')}catch(e){toast('تعذّر النسخ')}};
function contact(){
  const f=$('fb');if(okUrl(D.fb||'')){f.href=D.fb;f.classList.remove('hide')}else f.classList.add('hide');
  const ph=(D.phones||[]).filter(Boolean),mpOk=/^https:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|www\.google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|google\.[a-z.]+\/maps)/i.test(D.map||'');
  let h='';
  if(D.addr)h+='<div style="margin-bottom:8px">📍 '+esc(D.addr)+'</div>';
  if(mpOk)h+='<div class="cb"><a class="mp" href="'+esc(D.map)+'" target="_blank" rel="noopener">🗺️ افتح موقع المحل على الخريطة</a></div>';
  ph.forEach(p=>{const n=String(p).replace(/[^\d+]/g,'');if(n.length<5)return;const wa=n.startsWith('+')?n.slice(1):n.startsWith('00')?n.slice(2):'';
    h+='<div style="margin-top:12px"><b dir="ltr" style="display:block;text-align:right">'+esc(p)+'</b><div class="cb"><a class="call" href="tel:'+n+'">📞 اتصال</a>'+(wa?'<a class="wa" href="https://wa.me/'+wa+'" target="_blank" rel="noopener">💬 واتساب</a>':'')+'</div></div>'});
  const ct=$('ct');ct.innerHTML=h?'<h2>📍 تواصل معنا</h2>'+h:'';ct.classList.toggle('hide',!h);
}
$('q').oninput=()=>{if(D)list()};
$('lb').onclick=()=>$('lb').classList.add('hide');
$('rf').onclick=load;
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
let dp=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('ib').classList.remove('hide');$('hint').classList.add('hide')});
$('ib').onclick=async()=>{if(dp){dp.prompt();dp=null;$('ib').classList.add('hide')}};
addEventListener('appinstalled',()=>$('ib').classList.add('hide'));
const ua=navigator.userAgent,std=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(ua),inapp=/FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|Snapchat|TikTok|Twitter/i.test(ua);
setTimeout(()=>{
  if(std||!$('ib').classList.contains('hide'))return;
  if(inapp&&/android/i.test(ua)){$('hint').innerHTML='⚠️ أنت تفتح الرابط داخل تطبيق آخر ولا يمكن التثبيت من هنا. اضغط الزر لفتحه في المتصفح:<a class="btn" href="intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;end">🌐 فتح في المتصفح</a>';$('hint').classList.remove('hide');return}
  $('hint').textContent=inapp?'⚠️ أنت تفتح الرابط داخل تطبيق آخر (مثل فيسبوك)، ولا يمكن التثبيت من هنا. اضغط ⋮ ثم «فتح في المتصفح» أو افتح الرابط من Safari أو أي متصفح آخر.':ios?'📲 للتثبيت على iPhone: افتح الرابط في Safari، ثم اضغط زر المشاركة، ثم «إضافة إلى الشاشة الرئيسية».':'📲 لتثبيت التطبيق: اضغط ⋮ في أعلى المتصفح ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».';
  $('hint').classList.remove('hide');
},2500);
fetch('attar.apk',{method:'HEAD'}).then(r=>{if(r.ok&&/android/i.test(ua)&&!std)$('apk').classList.remove('hide')}).catch(()=>{});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
load();
</script>
</body>
</html>
